name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/*.test.js
      - run: node scripts/check-versions.js ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: pip install pytest && python3 -m pytest test/test_compress.py -q
